<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga Andri — Web Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d0f12;
  --surface:   #13161b;
  --surface2:  #1a1e25;
  --border:    #252a33;
  --border2:   #2e3540;
  --accent:    #00e5a0;
  --accent2:   #00b87d;
  --text:      #e8eaf0;
  --muted:     #6b7585;
  --muted2:    #8d97a8;
  --red:       #ff6b6b;
  --blue:      #4ea8de;
  --amber:     #f4c430;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 40px 16px 80px;
  -webkit-font-smoothing: antialiased;
}

/* ─── LAYOUT ─── */
.page {
  max-width: 760px;
  margin: 0 auto;
}

/* ─── HERO ─── */
.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 52px 40px 44px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(0,229,160,0.07) 0%, transparent 65%);
  pointer-events: none;
}

.hero::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 40px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(78,168,222,0.05) 0%, transparent 65%);
  pointer-events: none;
}

.hero-inner {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 32px;
  align-items: center;
  position: relative;
  z-index: 1;
}

.avatar-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }

.avatar-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, var(--accent), var(--blue));
  flex-shrink: 0;
}

.avatar {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: #1a2230;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 1px;
}

.avail-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  color: var(--accent);
  background: rgba(0,229,160,0.08);
  border: 1px solid rgba(0,229,160,0.2);
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}

.avail-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

.hero-text {}

.label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: block;
}

.name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 7vw, 52px);
  font-weight: 300;
  color: var(--text);
  line-height: 1.05;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.name em {
  font-style: italic;
  color: var(--accent);
}

.role-line {
  font-size: 13px;
  color: var(--muted2);
  font-weight: 300;
  margin-bottom: 20px;
  letter-spacing: 0.03em;
}

.role-line span {
  color: var(--blue);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
}

.bio {
  font-size: 14px;
  color: var(--muted2);
  line-height: 1.85;
  font-weight: 300;
  max-width: 500px;
  margin-bottom: 22px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.tag {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--muted2);
  border: 1px solid var(--border2);
  transition: all 0.2s;
  cursor: default;
}

.tag:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0,229,160,0.06);
}

/* ─── GRID ─── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}

/* ─── CARD ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.card:hover { border-color: var(--border2); }

.card-accent {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
}

.card-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ─── STAT CARDS ─── */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  transition: transform 0.2s, border-color 0.2s;
  cursor: default;
}

.stat-card:hover {
  transform: translateY(-2px);
  border-color: rgba(0,229,160,0.3);
}

.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 40px;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
  display: block;
}

.stat-lbl {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  display: block;
  letter-spacing: 0.05em;
  font-weight: 300;
}

/* ─── SKILL ─── */
.skill-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.skill-row:last-child { border-bottom: none; }

.skill-name {
  font-size: 13px;
  color: var(--text);
  width: 110px;
  flex-shrink: 0;
  font-weight: 400;
}

.bar-wrap {
  flex: 1;
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  width: 0;
  transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}

.bar-fill::after {
  content: '';
  position: absolute;
  right: 0; top: -2px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.skill-pct {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  width: 32px;
  text-align: right;
}

/* ─── EXP ─── */
.exp-item {
  display: flex;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.exp-item:last-child { border-bottom: none; }

.exp-timeline {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 14px;
  flex-shrink: 0;
  padding-top: 3px;
}

.exp-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid;
  position: relative;
}

.exp-line {
  width: 1px;
  flex: 1;
  background: var(--border);
  margin-top: 6px;
  min-height: 24px;
}

.exp-job {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 3px;
}

.exp-co {
  font-size: 12px;
  color: var(--muted2);
  margin-bottom: 4px;
}

.exp-yr {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* ─── CONTACT ─── */
.contact-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  transition: padding-left 0.2s;
}

.contact-item:last-child { border-bottom: none; }

.contact-item:hover { padding-left: 6px; }

.c-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  font-family: 'DM Mono', monospace;
  font-weight: 400;
  color: var(--muted2);
  flex-shrink: 0;
  transition: all 0.2s;
}

.contact-item:hover .c-icon {
  background: rgba(0,229,160,0.08);
  border-color: rgba(0,229,160,0.3);
  color: var(--accent);
}

.c-val {
  font-size: 13px;
  color: var(--text);
  font-weight: 400;
}

.c-lbl {
  font-size: 11px;
  color: var(--muted);
  font-weight: 300;
  margin-top: 1px;
}

/* ─── SOCIAL MEDIA ─── */
.social-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}

.social-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 18px 12px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  text-decoration: none;
  transition: all 0.22s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.social-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--s-color, var(--accent));
  opacity: 0;
  transition: opacity 0.22s;
}

.social-item:hover::before { opacity: 0.06; }

.social-item:hover {
  border-color: var(--s-color, var(--accent));
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.social-icon {
  width: 36px; height: 36px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border2);
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  transition: border-color 0.22s;
}

.social-item:hover .social-icon { border-color: var(--s-color, var(--accent)); }

.social-name {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  letter-spacing: 0.05em;
  position: relative;
  z-index: 1;
  transition: color 0.22s;
}

.social-item:hover .social-name { color: var(--text); }

.social-handle {
  font-size: 11px;
  color: var(--muted);
  position: relative;
  z-index: 1;
  text-align: center;
  word-break: break-all;
  line-height: 1.3;
}

/* ─── LINKS ─── */
.links-list { display: flex; flex-direction: column; gap: 0; }

.link-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  transition: padding-left 0.2s;
}

.link-item:last-child { border-bottom: none; }
.link-item:hover { padding-left: 6px; }

.link-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}

.link-item:hover .link-icon {
  background: rgba(0,229,160,0.08);
  border-color: rgba(0,229,160,0.3);
}

.link-label {
  font-size: 13px;
  color: var(--text);
  font-weight: 400;
}

.link-url {
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-top: 1px;
}

.link-arrow {
  margin-left: auto;
  color: var(--muted);
  font-size: 14px;
  transition: transform 0.2s, color 0.2s;
  flex-shrink: 0;
}

.link-item:hover .link-arrow {
  transform: translate(3px, -3px);
  color: var(--accent);
}

/* ─── TECH STACK ─── */
.tech-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
}

.tech-item {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px 10px;
  text-align: center;
  transition: all 0.2s;
  cursor: default;
}

.tech-item:hover {
  border-color: rgba(0,229,160,0.35);
  background: rgba(0,229,160,0.04);
  transform: translateY(-2px);
}

.tech-icon { font-size: 22px; margin-bottom: 6px; }

.tech-name {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  display: block;
}

/* ─── FOOTER ─── */
.footer {
  text-align: center;
  padding: 32px 0 0;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.footer span {
  color: var(--accent);
  font-size: 13px;
  vertical-align: middle;
}

/* ─── ANIMATIONS ─── */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.reveal.show {
  opacity: 1;
  transform: none;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  body { padding: 0 0 60px; }
  .hero { border-radius: 0; padding: 36px 20px 32px; }
  .hero-inner { grid-template-columns: 1fr; text-align: center; gap: 20px; }
  .avatar-col { flex-direction: row; justify-content: center; }
  .tags { justify-content: center; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .page { padding: 0; }
  .card { border-radius: 0; border-left: none; border-right: none; margin: 0 -16px; }
  .grid-2 .card, .grid-3 .card { border-radius: 0; }
  .name { font-size: 38px; }
  .bio { max-width: 100%; }
}

@media (max-width: 360px) {
  .tech-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

  <div class="footer reveal">
    <span>&#9670;</span>
    &nbsp;<span id="footer-text"></span>&nbsp;
    <span>&#9670;</span>
  </div>

</div>

/* ──────────────────────────────────── */

// Avatar
document.getElementById("avatar").textContent =
  data.name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");

// Mono label
document.getElementById("label-mono").textContent = `// ${data.mono}`;

// Name — split last word italic
const parts = data.name.trim().split(/\s+/);
const nameEl = document.getElementById("name");
if (parts.length >= 2) {
  nameEl.innerHTML = parts.slice(0, -1).join(" ") + " <em>" + parts[parts.length - 1] + "</em>";
} else {
  nameEl.textContent = data.name;
}

// Role
document.getElementById("role-line").innerHTML =
  `${data.role} &nbsp;·&nbsp; <span>${data.location}</span>`;

// Bio
document.getElementById("bio").textContent = data.bio;

// Tags
const tagsEl = document.getElementById("tags");
data.tags.forEach(t => {
  const s = document.createElement("span");
  s.className = "tag"; s.textContent = t;
  tagsEl.appendChild(s);
});

// Stats
const statsEl = document.getElementById("stats");
data.stats.forEach(s => {
  statsEl.innerHTML += `
    <div class="stat-card reveal">
      <span class="stat-num">${s.value}</span>
      <span class="stat-lbl">${s.label}</span>
    </div>`;
});

// Skills
const skillsEl = document.getElementById("skills");
data.skills.forEach((s, i) => {
  skillsEl.innerHTML += `
    <div class="skill-row">
      <span class="skill-name">${s.name}</span>
      <div class="bar-wrap"><div class="bar-fill" id="b${i}" data-pct="${s.pct}"></div></div>
      <span class="skill-pct">${s.pct}%</span>
    </div>`;
});

// Exp
const expEl = document.getElementById("exp");
data.exp.forEach((e, i) => {
  const isLast = i === data.exp.length - 1;
  expEl.innerHTML += `
    <div class="exp-item">
      <div class="exp-timeline">
        <div class="exp-dot" style="background:${e.color}22; border-color:${e.border}"></div>
        ${!isLast ? '<div class="exp-line"></div>' : ''}
      </div>
      <div>
        <div class="exp-job">${e.job}</div>
        <div class="exp-co">${e.company}</div>
        <div class="exp-yr">${e.year}</div>
      </div>
    </div>`;
});

// Tech
const techEl = document.getElementById("tech");
data.tech.forEach(t => {
  techEl.innerHTML += `
    <div class="tech-item">
      <div class="tech-icon">${t.icon}</div>
      <span class="tech-name">${t.name}</span>
    </div>`;
});

// Contact
const contactEl = document.getElementById("contact");
data.contact.forEach(c => {
  contactEl.innerHTML += `
    <a class="contact-item" href="${c.href}" target="_blank" rel="noopener">
      <div class="c-icon">${c.icon}</div>
      <div>
        <div class="c-val">${c.value}</div>
        <div class="c-lbl">${c.label}</div>
      </div>
    </a>`;
});

// Social Media
const socialEl = document.getElementById("social");
data.social.forEach(s => {
  socialEl.innerHTML += `
    <a class="social-item" href="${s.href}" target="_blank" rel="noopener" style="--s-color:${s.color}">
      <div class="social-icon" style="color:${s.color}">${s.svg}</div>
      <span class="social-name">${s.name}</span>
      <span class="social-handle">${s.handle}</span>
    </a>`;
});

// Links
const linksEl = document.getElementById("links");
data.links.forEach(l => {
  linksEl.innerHTML += `
    <a class="link-item" href="${l.href}" target="_blank" rel="noopener">
      <div class="link-icon">${l.icon}</div>
      <div>
        <div class="link-label">${l.label}</div>
        <div class="link-url">${l.url}</div>
      </div>
      <span class="link-arrow">↗</span>
    </a>`;
});

// Footer
document.getElementById("footer-text").textContent =
  `© ${new Date().getFullYear()} ${data.name}`;

// ── Animate bars after load ──
window.addEventListener("load", () => {
  setTimeout(() => {
    data.skills.forEach((s, i) => {
      const el = document.getElementById("b" + i);
      if (el) el.style.width = s.pct + "%";
    });
  }, 300);
});

// ── Scroll reveal ──
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add("show");
      observer.unobserve(e.target);
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll(".reveal").forEach((el, i) => {
  el.style.transitionDelay = (i * 0.07) + "s";
  observer.observe(el);
});
</script>
